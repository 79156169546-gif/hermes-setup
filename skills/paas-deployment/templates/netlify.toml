# Static-host config for a Vite SPA (Netlify).
# Place at the repo root. Pins build + publish and adds the SPA rewrite
# that client-side routes such as /admin and /cabinet need on hard refresh.

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA routing: every unmatched path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite emits content-hashed asset names — cache them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The entry document must never be cached, or clients keep an old bundle
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
